# Served by nginxinc/nginx-unprivileged (non-root), so we listen on 8080.
# This file is included inside the image's `http {}` block, so `map` is allowed here.

# Cache policy by request path. Angular's production build fingerprints file names
# (e.g. main-ABCD1234.js, styles-ABCD1234.css, media/*), so those can be cached forever.
# Everything else, including index.html, must be revalidated so deploys take effect.
map $uri $cache_control {
    ~*-[A-Z0-9]{8}\.(?:js|mjs|css)$  "public, max-age=31536000, immutable";
    ~*^/media/                       "public, max-age=31536000, immutable";
    default                          "no-cache";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # --- gzip ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # --- headers (applied to every response from this server) ---------------
    # Note: nginx drops server-level add_header in any location that sets its own,
    # so locations below must not use add_header.
    add_header Cache-Control           $cache_control always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # --- container health check ---------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- fingerprinted build output: real file or 404 -------------------------
    # Never fall back to index.html here, or a stale chunk request after a deploy
    # gets HTML back and fails with a MIME-type error instead of a clean 404.
    location ~* -[A-Z0-9]{8}\.(?:js|mjs|css)$ {
        try_files $uri =404;
    }

    location ^~ /media/ {
        try_files $uri =404;
    }

    # --- SPA fallback ---------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
