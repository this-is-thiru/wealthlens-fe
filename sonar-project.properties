# SonarQube Cloud: CI-based analysis (Automatic Analysis is disabled in the project settings).
# The token is NOT stored here; CI passes it via the SONAR_TOKEN secret.

sonar.organization=this-is-thiru
sonar.projectKey=this-is-thiru_wealthlens-fe
sonar.projectName=WealthLens

sonar.sourceEncoding=UTF-8

# --- Scope --------------------------------------------------------------------
# SonarQube Cloud analyzes the whole project by default (sonar.sources/sonar.tests
# have no effect), so scope is narrowed with exclusions only.
# Not analysed: specs, environment config, bootstrap/polyfill/test-setup entry
# points, type declarations and static assets.
sonar.exclusions=\
  **/*.spec.ts,\
  src/environments/**,\
  src/main.ts,\
  src/polyfills.ts,\
  src/test-setup.ts,\
  **/*.d.ts,\
  src/assets/**

# Templates aren't instrumented for coverage (see coverageExclude in angular.json),
# so don't count them as uncovered.
sonar.coverage.exclusions=**/*.html

# --- Coverage -----------------------------------------------------------------
# Written by `npm run test:ci` (Angular unit-test builder, Vitest + v8 coverage).
sonar.javascript.lcov.reportPaths=coverage/wealthlens/lcov.info
