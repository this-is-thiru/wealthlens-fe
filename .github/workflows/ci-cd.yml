name: CI/CD

on:
  pull_request:
    branches: [master, development, staging, release]
  push:
    branches: [master, development, staging, release]

# One run per branch/PR; a newer push cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  APP_NAME: wealthlens # angular.json -> projects.wealthlens (build output: dist/wealthlens/browser)
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test, coverage & SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for Sonar blame / new-code detection

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present # no-op until a "lint" script exists

      - name: Unit tests with coverage
        run: npm run test:ci

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/wealthlens/coverage-summary.json') != '' }}
        run: |
          node -e '
            const t = require("./coverage/wealthlens/coverage-summary.json").total;
            // Thresholds come from angular.json (test target, "ci" configuration).
            const goals = require("./angular.json").projects[process.env.APP_NAME]
              .architect.test.configurations.ci.coverageThresholds || {};
            const rows = ["statements", "branches", "functions", "lines"].map((k) => {
              const m = t[k];
              const goal = goals[k];
              const ok = goal === undefined ? "" : m.pct >= goal ? "✅" : "❌";
              const goalText = goal === undefined ? "–" : `${goal}%`;
              return `| ${k[0].toUpperCase() + k.slice(1)} | ${m.pct}% | ${m.covered}/${m.total} | ${goalText} | ${ok} |`;
            });
            console.log([
              "## Coverage",
              "",
              "| Metric | Coverage | Covered | Threshold | |",
              "| --- | ---: | ---: | ---: | :---: |",
              ...rows,
            ].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/wealthlens/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # Secrets aren't available to PRs from forks, so Sonar only runs for
      # pushes and same-repo PRs. It still runs when coverage thresholds fail,
      # so the analysis is always up to date (the job fails either way).
      - name: SonarQube Cloud scan
        if: >-
          ${{ !cancelled()
              && hashFiles('coverage/wealthlens/lcov.info') != ''
              && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube quality gate
        if: >-
          ${{ !cancelled()
              && hashFiles('.scannerwork/report-task.txt') != ''
              && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve build settings
        id: cfg
        run: |
          # Branch name for both push and pull_request events
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SAFE_BRANCH="$(echo "$BRANCH" | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
          echo "branch=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = "release" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "build_config=production" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_BASE_REF" = "release" ]; then
            echo "build_config=production" >> "$GITHUB_OUTPUT" # PR into release: build what will ship
          else
            echo "build_config=development" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.cfg.outputs.branch }}
            type=sha,format=short,prefix=${{ steps.cfg.outputs.branch }}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' && github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.title=${{ env.APP_NAME }}

      - name: Build (and push on branch pushes)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: |
            APP_NAME=${{ env.APP_NAME }}
            BUILD_CONFIG=${{ steps.cfg.outputs.build_config }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          {
            echo "## Docker image"
            echo ""
            echo "- Build config: \`${{ steps.cfg.outputs.build_config }}\`"
            echo "- Pushed: \`${{ github.event_name == 'push' }}\`"
            echo "- Tags:"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/  - `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
