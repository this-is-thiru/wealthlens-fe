name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Only one deployment at a time; don't cancel a deploy that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '22'
  CUSTOM_DOMAIN: ourwealthlens.com

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build (production)
        run: npx ng build --configuration production --base-href /

      - name: Prepare Pages output
        working-directory: dist/wealthlens/browser
        run: |
          # SPA fallback: GitHub Pages serves 404.html for unknown paths, so deep links like /broker-charges load the app.
          cp index.html 404.html
          # Custom domain + disable Jekyll processing.
          echo "${CUSTOM_DOMAIN}" > CNAME
          touch .nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/wealthlens/browser

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
